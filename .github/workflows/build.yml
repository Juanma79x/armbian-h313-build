name: Build Armbian H313 TOC0 Secure Boot with Desktop

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/powershell /usr/share/swift /usr/local/share/miniconda
          sudo rm -rf /usr/lib/jvm /usr/share/java /usr/share/gradle
          sudo rm -rf /usr/local/graalvm /usr/local/.ghcup
          sudo rm -rf /usr/local/share/chromium /usr/local/share/edge
          sudo rm -rf /usr/local/share/vcpkg /usr/local/share/kotlinc
          sudo apt-get clean
          sudo apt-get autoremove -y
          sudo rm -rf /var/lib/apt/lists/*
          sudo rm -rf /tmp/*
          df -h

      - name: Set up QEMU (fixes the binfmt error)
        uses: docker/setup-qemu-action@v3
        with:
          image: tonistiigi/binfmt:latest
          platforms: arm64,arm,riscv64

      - name: Verify binfmt is working
        run: |
          echo "=== binfmt handlers ==="
          ls /proc/sys/fs/binfmt_misc/ || true
          qemu-aarch64 --version || true

      - name: Clone Armbian Build Framework
        run: |
          git clone https://github.com/NickAlilovic/build.git --branch v20250306 --depth 1 armbian-build
          cd armbian-build

      - name: Generate RSA Key for TOC0 Secure Boot
        run: |
          cd armbian-build
          openssl genrsa -out root_key.pem 2048

      - name: Patch defconfig with TOC0
        run: |
          cd armbian-build
          DEFCONFIG=$(find . -type f -name "*defconfig*" | grep -i "x96.*lpddr3" | head -1)
          if [ -z "$DEFCONFIG" ]; then
            DEFCONFIG=$(find . -type f -name "*defconfig*" | grep -i "x96" | head -1)
          fi
          if [ -z "$DEFCONFIG" ]; then
            echo "ERROR: No se encontró defconfig de x96q"
            exit 1
          fi
          echo "Archivo encontrado: $DEFCONFIG"
          echo "CONFIG_SPL_IMAGE_TYPE_SUNXI_TOC0=y" >> "$DEFCONFIG"
          tail -n 5 "$DEFCONFIG"

      - name: Compile Armbian Image (server/minimal)
        run: |
          cd armbian-build
          ./compile.sh build \
            BOARD=x96q-lpddr3-v1-3 \
            BRANCH=edge \
            RELEASE=bookworm \
            BUILD_MINIMAL=yes \
            BUILD_DESKTOP=no \
            KERNEL_ONLY=no \
            KERNEL_CONFIGURE=no \
            COMPRESS_OUTPUTIMAGE="sha,img" \
            CLEAN_LEVEL="make,debs"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Armbian-H313-IK316Q-TOC0-SecureBoot
          path: armbian-build/output/images/*.img.xz
          retention-days: 7
